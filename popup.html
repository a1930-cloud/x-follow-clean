<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css"><title>留关</title></head><body class="popup"><header><b>留关</b><span class="badge">v0.3.9</span></header><h1>把名单整理好。</h1><p>在自己的关注或粉丝页面开启，可自动滚动收集已加载的账号。</p><label for="owner">你的 X 用户名</label><input id="owner" placeholder="例如 NorrisChen1024" maxlength="16" autocomplete="off"><p class="muted">首次输入后会保存在本机。更换账号请先在清单中开启新一轮。</p><label class="check"><input id="autoScroll" type="checkbox" checked>自动滚到底部收集（Esc 停止）</label><button id="start" class="primary">开始收集当前列表</button><button id="stop">停止当前页收集</button><button id="open">查看清单 / 勾选取关 ↗</button><p id="status" role="status" aria-live="polite"></p><p class="muted">只记录页面内容，不读取密码、Cookie 或私信。页面读取仍须遵守 X 规则；自动滚动仅在当前标签页可见时进行。取关请进入本地清单，勾选并确认后执行。</p><script src="core.js"></script><script src="popup.js"></script></body></html>
